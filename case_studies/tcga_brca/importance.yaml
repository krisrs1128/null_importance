defaults:
  - _self_

hydra:
  job:
    chdir: false

data:
  parquet_dir: data
  model_dir: results

methods:
  mdi: true
  permutation: true
  treeshap: true
  kernelshap: true
  minshap: true
  loco: true
  correlation: true
  knockoffs: true
  pdp_variance: true
  integrated_gradients: true

permutation:
  n_repeats: 100

minshap:
  n_samples: 10
  n_orderings: 100
  n_background: 100

kernelshap:
  n_samples: 10
  n_coalitions: 100
  n_background: 100

pdp:
  grid_resolution: 20

integrated_gradients:
  n_samples: 10
  n_steps: 64
  eps: 1e-5

knockoffs:
  fdr: 0.1
  max_features: 500

rf:
  n_trees: 50
  min_samples_leaf: [5, 10]

vignettes:
  n_features: 100

seed: 895404

categories:
  mdi: marginal
  permutation: risk
  treeshap: risk
  minshap: conditional
  loco: risk
  correlation: marginal
  knockoffs: conditional
  pdp_variance: functional
  kernelshap: marginal
  integrated_gradients: functional
