defaults:
  - _self_

hydra:
  job:
    chdir: false

seed: 2026

paths:
  data_dir: data
  results_dir: results/importance
  model_path: results/model.pt
  model_source_dir: results/model_source
  sample_meta: results/sample_meta.csv

model:
  batch_size: 256

explain:
  n_samples: 3650
  n_background: 100
  target: predicted_label

marginalminshap:
  # marginal minSHAP: same coalitions/masking as shap, aggregated with min
  # instead of the Shapley mean. n_orderings kept small relative to shap's
  # KernelExplainer nsamples since each ordering costs n_pixels+1 model calls.
  n_orderings: 20

integrated_gradients:
  n_steps: 10
  eps: 0.0001

saliency:
  eps: 0.0001

local_ttest:
  # we consider only a subsample ("pool") for neighborhood selection
  distance: resnet_final_embedding_l2
  n_pool: 5000
  n_neighbors: 200
  min_group_size: 1

run:
  sample_limit: 10
