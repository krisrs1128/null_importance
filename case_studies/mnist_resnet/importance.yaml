defaults:
  - _self_

hydra:
  job:
    chdir: false

seed: 2026

paths:
  data_dir: data
  results_dir: results/importance
  model_path: results/model.pt
  model_source_dir: results/model_source
  sample_meta: results/sample_meta.csv

model:
  batch_size: 256

explain:
  n_samples: 3650
  n_background: 100
  target: predicted_label

marginalminshap:
  # marginal minSHAP: fixed-background IME, aggregated with min.
  n_orderings: 40
  background_eval_size: 16
  prefix_batch_size: 64

integrated_gradients:
  n_steps: 10
  eps: 0.0001

gradient_x_input:
  eps: 0.0001

saliency:
  eps: 0.0001

local_ttest:
  # we consider only a subsample ("pool") for neighborhood selection
  distance: resnet_final_embedding_l2
  n_pool: 5000
  n_neighbors: 200
  min_group_size: 1

run:
  sample_limit: 10
