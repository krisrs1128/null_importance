defaults:
  - _self_

hydra:
  job:
    chdir: false

# Global dimensionality definition
dimensions:
  n_features: 10
  n_nonnull: 4

datasets:
  linear_additive:
    beta: 4.0   # same across all n_nonnull signal features
    sigma_y: 1.0
  xor:
    gamma: 3.0
    sigma_y: 1.0
  product_interaction:
    gamma: 3.0
    sigma_y: 1.0
  dependent_features:
    noise_scale: 0.3
    gamma: 3.0
    sigma_y: 1.0
  confounding:
    noise_scale: 0.3
    gamma: 3.0
    sigma_y: 1.0

response_types: [classification, regression]
sample_sizes: [50, 500, 5000]
seed: 2026

# We aren't running mdi, treeshap, or loco because they need actual tree
# structured models (at least in our assumed implementations) and the synthetic
# data experiment assumes the simulated response as the model output
methods:
  correlation: true
  permutation: true
  minshap: true
  kernelshap: true
  knockoffs: true
  pdp_variance: true
  integrated_gradients: true
  mdi: false
  treeshap: false
  loco: false

permutation:
  n_repeats: 100

minshap:
  n_samples: 10
  n_orderings: 100
  n_background: 100

kernelshap:
  n_samples: 10
  n_coalitions: 100
  n_background: 100

knockoffs:
  fdr: 0.1
  max_features: 500

pdp:
  grid_resolution: 20

integrated_gradients:
  n_samples: 10
  n_steps: 64
  eps: 1e-5

categories:
  correlation: marginal
  kernelshap: marginal
  permutation: risk
  minshap: conditional
  knockoffs: conditional
  pdp_variance: functional
  integrated_gradients: functional
