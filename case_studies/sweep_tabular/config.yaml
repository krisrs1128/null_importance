defaults:
  - _self_

hydra:
  job:
    chdir: false

# Global dimensionality definition
dimensions:
  n_features: 12
  n_nonnull: 6

datasets:
  linear_additive:
    beta: 4.0   # same across all n_nonnull signal features
    sigma_y: 1.0
  parity:
    gamma: 3.0
    sigma_y: 1.0
  product_interaction:
    gamma: 3.0
    sigma_y: 1.0
  dependent_features:
    noise_scale: 0.3
    gamma: 3.0
    sigma_y: 1.0
  mediated_chains:
    chain_length: 3
    transition_noise: 1.0
    gamma: 3.0
    sigma_y: 1.0
  confounding:
    noise_scale: 0.3
    gamma: 3.0
    sigma_y: 1.0
  quadratic:
    gamma: 3.0
    sigma_y: 1.0

response_types: [classification, regression]
sample_sizes: [50, 500, 5000]

# One generate+sweep run per seed. seeds[0] is the canonical seed used by the
# single-run panels in visualize.qmd; the rest exist to see run-to-run spread
# (e.g. the correlation-vs-knockoffs divergence figure).
seeds: [2026, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009]

figures_dir: results/figures

# We aren't running mdi, treeshap, or loco because they need actual tree
# structured models (at least in our assumed implementations) and the synthetic
# data experiment assumes the simulated response as the model output
methods:
  correlation: true
  permutation: true
  minshap: true
  sage: true
  knockoffs: true
  pdp_variance: true
  integrated_gradients: true
  gcm: true
  mdi: false
  treeshap: false
  loco: false

permutation:
  n_repeats: 100

risk:
  n_orderings: 30
  model_params:
    n_estimators: 50
    max_depth: 3

# gather focused data to understand shap vs. minshap
# in the risk-formulation v(S) = -E[l(f(X[s], y)]
risk_summaries:
  enabled: true
  save_contributions: true
  contribution_datasets: [mediated_chains]

knockoffs:
  fdr: 0.1
  max_features: 500

pdp:
  grid_resolution: 20

integrated_gradients:
  n_samples: 10
  n_steps: 64
  eps: 1e-5

gcm:
  n_estimators: 100

categories:
  correlation: marginal
  permutation: risk
  minshap: conditional
  sage: risk
  knockoffs: conditional
  pdp_variance: functional
  integrated_gradients: functional
  gcm: conditional
