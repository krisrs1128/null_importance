data_dir: data/simulations
output_dir: results/simulation_attribution
dataset_types:
  - linear_additive
  - xor
  - product_interaction
methods:
  - baseline_shap
  - baseline_minshap
  - marginal_shap
  - marginal_minshap
  - integrated_gradients
row_limit: 3
background_size: 20
n_orderings: 16
n_steps: 16
seed: 0
baseline_strategy: zeros
include_unsupported: false
overwrite: false
metrics:
  injected_null: false
  stability: false
  stability_neighbors: 8
  stability_radius: 0.05

